name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose --no-progress
            --root-dir ./_site
            './_site/**/*.html'
          fail: false
          output: ./lychee/out.md

      - name: Check for existing open issue
        if: steps.lychee.outputs.exit_code != 0
        id: check_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "Link Checker Report in:title" --json number --jq '.[0].number // empty')
          echo "issue_number=$existing" >> "$GITHUB_OUTPUT"

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0 && steps.check_issue.outputs.issue_number == ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated